name: TM Bilet Botu

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamını Kur (Python 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sistem Bağımlılıklarını ve Kütüphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
          pip install requests playwright ddddocr
          npx playwright install --with-deps chromium

      - name: Bilet Botunu Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TM_PHONE: ${{ secrets.TM_PHONE }}
          TM_PASSWORD: ${{ secrets.TM_PASSWORD }}
          TM_PROXY_SERVER: ${{ secrets.TM_PROXY_SERVER }}
        run: |
          python Bot.py

      - name: Hata veya Ekran Görüntülerini Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-and-screenshots
          path: |
            *.png
            *.html
          retention-days: 7
          
