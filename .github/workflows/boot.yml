name: Turkmenistan Airlines Ticket Bot

on:
  workflow_dispatch:
  schedule:
    # Türkmenistan saatiyle (UTC+5) 08:00 - 21:00 arası her 15 dakikada bir (UTC 03:00 - 15:45)
    - cron: '*/15 3-15 * * *'

concurrency:
  group: ticket-bot-execution
  cancel-in-progress: false

jobs:
  run-ticket-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Yerel Saat Kontrolu
        id: time-check
        run: |
          HOUR=$(TZ="Asia/Ashgabat" date +%-H)
          echo "Turkmenistan Saati: $HOUR:00"
          if [ "$HOUR" -ge 23 ] || [ "$HOUR" -lt 8 ]; then
            echo "ALLOWED=false" >> $GITHUB_ENV
            echo "Gece saat araligindayiz (21:00 - 08:00). Bot calistirilmayacak."
          else
            echo "ALLOWED=true" >> $GITHUB_ENV
            echo "Calisma saatleri icindeyiz (08:00 - 21:00)."
          fi

      - name: Python Kurulumu
        if: env.ALLOWED == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bagimliliklari Yukle
        if: env.ALLOWED == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install playwright ddddocr Pillow requests

      - name: Playwright Kurulumu
        if: env.ALLOWED == 'true'
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Botu Calistir
        if: env.ALLOWED == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TM_PHONE: ${{ secrets.TM_PHONE }}
          TM_PASSWORD: ${{ secrets.TM_PASSWORD }}
          TM_PROXY_SERVER: ${{ secrets.TM_PROXY_SERVER }}
        run: |
          python "bot.py"
          
